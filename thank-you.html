<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Sent — Joy Culanculan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070709;color:#f7f6fb;font-family:'DM Sans',sans-serif;padding:24px}
    .card{width:min(680px,100%);border:1px solid rgba(255,255,255,.09);border-radius:28px;padding:60px;background:
      radial-gradient(circle at 20% 0%,rgba(185,140,255,.16),transparent 36%),#0d0d11;text-align:center}
    .icon{width:64px;height:64px;border-radius:50%;margin:0 auto 24px;display:grid;place-items:center;background:#fff;color:#09090b;font-size:26px}
    h1{font:800 clamp(40px,7vw,68px)/1 'Manrope',sans-serif;letter-spacing:-.05em;margin:0}
    p{color:#9b99a7;font-size:17px;line-height:1.65;max-width:520px;margin:22px auto 30px}
    a{display:inline-flex;padding:14px 21px;border-radius:999px;background:#fff;color:#09090b;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">✓</div>
    <h1>Message sent.</h1>
    <p>Thanks for reaching out. Your project inquiry has been submitted and I’ll get back to you through the email you provided.</p>
    <a href="index.html">Back to portfolio</a>
  </main>
</body>
</html>
